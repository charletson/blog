<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易计算</title>
<style>
:root {
  --bg: #f4f6f9; --card: #fff; --line: #e3e8ef;
  --txt: #1f2d3d; --sub: #6b7a8d;
  --red: #e03131; --green: #0ca678; --blue: #1c7ed6; --amber: #f08c00;
  --chip: #eef3fa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
       background: var(--bg); color: var(--txt); line-height: 1.6; padding: 14px; }
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --line: #e3e8ef;
    --txt: #1f2d3d; --sub: #6b7a8d;
    --red: #e03131; --green: #0ca678; --blue: #1c7ed6; --amber: #f08c00;
    --chip: #eef3fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--txt); line-height: 1.6; padding: 20px 14px 60px; }
  .wrap { max-width: 1060px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  .page-title{margin-bottom:18px} .page-title h1{font-size:22px;font-weight:800} .page-title p{color:var(--sub);font-size:13px;margin-top:3px}
  .header-row { display: inline-flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 24px; letter-spacing: 1px; }
  header p { color: var(--sub); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11.5px; font-weight: 400; color: var(--sub); background: var(--chip);
         padding: 2px 9px; border-radius: 20px; }
  .tag-btn { cursor: pointer; border: none; line-height: 1.6; }
  .tag-btn:hover { filter: brightness(0.9); }

  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: 1fr 220px 120px 260px; }
  .g5 { grid-template-columns: 380px 180px 1fr 1fr 1fr; }
  #calcCard .field label { text-align: center; }
  #calcCard input, #calcCard select { text-align: center; }
  #calcCard #code { text-align: left; }
  #calcCard #rFee { text-align: left; }
  .code-wrap { position: relative; }
  .code-wrap input { padding-right: 110px; }
  #mktChip { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 9.5px; padding: 1px 7px; pointer-events: none; }
  .fee-wrap { position: relative; }
  .fee-wrap input { padding-right: 160px; }
  .fee-chip { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 9.5px; padding: 1px 7px; border-radius: 20px; background: var(--chip); color: var(--sub); pointer-events: none; }
  

  .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14.5px; background: #fff; color: var(--txt); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--blue); }

  .btn { border: none; border-radius: 8px; padding: 9px 18px; font-size: 13.5px; cursor: pointer;
         font-weight: 600; transition: filter .15s; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.green { background: var(--green); color: #fff; }
  .btn.ghost { background: var(--chip); color: var(--txt); }
  .btn.red { background: #ffe3e3; color: var(--red); }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn:hover { filter: brightness(1.06); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; background: #fafbfd; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--red); font-weight: 700; }
  .down { color: var(--green); font-weight: 700; }
  .badge-buy { display: inline-block; background: #e7f1fd; color: var(--blue); border-radius: 5px;
               padding: 1px 7px; font-size: 11.5px; font-weight: 700; }
  .badge-sell { display: inline-block; background: #fdeeee; color: var(--red); border-radius: 5px;
                padding: 1px 7px; font-size: 11.5px; font-weight: 700; }
  .after-qty { color: var(--sub); font-size: 11px; font-weight: 400; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  @media (max-width: 700px) { .summary { grid-template-columns: 1fr 1fr; } }
  .s-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .s-item .k { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .s-item .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .s-item.main { background: #eaf4ff; border-color: #bcdcf5; }
  .s-item.main .v { color: var(--blue); }

  .market-chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px;
                 background: var(--chip); color: var(--sub); }
  .market-chip.sh { color: var(--red); background: #fdeeee; }
  .market-chip.sz { color: var(--blue); background: #e7f1fd; }
  .market-chip.etf { color: var(--amber); background: #fdf3e2; }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .note { font-size: 11.5px; color: var(--sub); margin-top: 10px; line-height: 1.8; }
  .empty { color: var(--sub); font-size: 12.5px; text-align: center; padding: 14px 0; }
  .tip { background: #fff8e6; border: 1px solid #ffe08a; color: #9a6b00; border-radius: 8px;
         padding: 8px 12px; font-size: 12.5px; margin-top: 10px; display: none; }
  .err-bar { background: #ffe3e3; border: 1px solid #ffb3b3; color: #c92a2a; border-radius: 8px;
              padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; display: none; }
  .hold-ref { background: #eaf4ff; border: 1px solid #bcdcf5; color: #1c5f9e; border-radius: 8px;
              padding: 8px 12px; font-size: 11.5px; margin-top: 10px; display: none; }
  .t-ref { color: var(--sub); font-size: 11.5px; line-height: 1.8; margin-top: 10px; text-align: center; display: none; }
  .t-flex { display: inline-flex; align-items: center; gap: 14px; }
  .t-pnl { font-weight: 700; }
  .t-pnl.pos { color: var(--red); }
  .t-pnl.neg { color: var(--green); }
  .t-ref.warn { background: #fff3e6; border: 1px solid #ffd8a8; border-radius: 8px; padding: 8px 12px; color: #9a5b00; }
  footer { text-align: center; color: var(--sub); font-size: 12px; margin-top: 18px; }

  .modal-mask { position: fixed; inset: 0; background: rgba(20,30,50,.45); z-index: 999;
                display: flex; align-items: center; justify-content: center; }
  .modal-box { background: #fff; border-radius: 14px; padding: 18px 22px; width: min(520px, 92vw);
               max-height: 84vh; overflow: auto; box-shadow: 0 14px 44px rgba(0,0,0,.28); }
  .modal-head { display: flex; justify-content: space-between; align-items: center;
                font-size: 14.5px; font-weight: 700; margin-bottom: 12px; }
  .modal-close { background: none; border: none; font-size: 15px; cursor: pointer; color: #adb5bd; }


/* ===== 沪深完整计算板块（2026 xlsx 复刻 · w26 前缀隔离） ===== */
.w26-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.w26-cols{grid-template-columns:1fr}}
/* 卡片容器：白底圆角 + 轻阴影 */
.w26-side{border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(31,45,61,.06)}
.w26-side h3{font-size:13.5px;margin:0;padding:9px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcfe,#f2f5f9);letter-spacing:.5px}
.w26-side h3 .w26-m-sh{color:var(--red);font-weight:700}
.w26-side h3 .w26-m-sz{color:var(--blue);font-weight:700}
/* 左上角 A1 市场徽章 */
.w26-corner{font-size:13px;font-weight:700;text-align:center!important;letter-spacing:2px;padding:2px 4px!important}
.w26-corner.w26-m-sh{color:var(--red)}
.w26-corner.w26-m-sz{color:var(--blue)}
/* 表头行：沪市红调 / 深市蓝调 */
.w26-sh-head th{background:linear-gradient(180deg,#fff5f5,#ffe9e9);color:#c92a2a;border-bottom:1px solid #ffd8d8}
.w26-sz-head th{background:linear-gradient(180deg,#f0f7ff,#e2efff);color:#1971c2;border-bottom:1px solid #d3e6ff}
.w26-cols th{text-align:center;padding:7px 4px;font-size:12.5px;font-weight:600;letter-spacing:.5px}
.w26-cols th:first-child{text-align:left;padding-left:12px;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:0}
/* 列头圆点标记（红=买入 绿=卖出 橙=模拟） */
.w26-cols th .w26-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
th.w26-clr{cursor:pointer;user-select:none;transition:filter .15s}
th.w26-clr:hover{filter:brightness(.95);text-decoration:underline}
th.w26-clr:active{opacity:.6}
/* 模拟卖出列：暖橙系 */
th.w26-sim{background:linear-gradient(180deg,#fff8ef,#fcead0)!important;color:#9a6b1f!important}
td.w26-sim{background:#fef7ec;box-shadow:inset 0 0 0 1px #f3d9a4}
td.w26-sim input{background:#fffdf6}
/* 行标签列 */
.w26-cols td:first-child{text-align:left;padding-left:12px;color:var(--sub);font-size:12px;white-space:nowrap}
td.w26-inp{padding:4px 5px}
/* 输入框：圆角 + hover/focus 光环 */
.w26-cols input[type=number]{width:100%;padding:6px 9px;border:1px solid #dfe5ec;border-radius:8px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;outline:none;background:#fafbfc;transition:border-color .15s,box-shadow .15s,background .15s}
.w26-cols input[type=number]:hover{border-color:#c6d2e0;background:#fff}
.w26-cols input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(28,126,214,.14)}
.w26-cols input[readonly]{background:#eef1f5;color:var(--sub);cursor:not-allowed}
/* 结果格 */
.w26-cols td.num{font-size:12.5px;font-variant-numeric:tabular-nums;padding:6px 5px;text-align:right;color:#3d4c5f}
.w26-cols tr:not(:first-child):nth-child(even) td{background:rgba(244,246,249,.55)}
.w26-cols tr:hover td{background:#f7fafd}
/* 主结果（成本价/保本价）：蓝底渐变高亮 */
.w26-main-cell{background:linear-gradient(135deg,#eef4ff,#ddebff)!important;font-weight:700;font-size:13.5px;color:#1c3d5f}
/* 盈亏：红盈绿亏 + 浅色底 */
td.w26-pos{background:#fff0f0!important}
td.w26-neg{background:#e6faf4!important}
.w26-pos{color:var(--red);font-weight:700}
.w26-neg{color:var(--green);font-weight:700}
.w26-note{color:var(--sub);font-size:11.5px;margin-top:8px;line-height:1.8}


</style>

<body>
<!-- 沪深完整计算（2026 xlsx 复刻）：交易计算 -->
<div class="card">
  <h2><span>💹 交易计算</span><span class="tag">点击「买入 / 卖出 / 模拟卖出」可清空对应列数据</span></h2>
  <div class="w26-cols">
    <div class="w26-side">
      <table id="shTable">
        <tr class="w26-sh-head"><th class="w26-corner w26-m-sh">沪市</th><th class="w26-clr" onclick="clearW26Col('sh','B')" title="点击清空该列（成交数量/成交价格）"><span class="w26-dot" style="background:var(--red)"></span>买入</th><th class="w26-clr" onclick="clearW26Col('sh','S')" title="点击清空该列（成交数量/成交价格）"><span class="w26-dot" style="background:var(--green)"></span>卖出</th><th class="w26-sim w26-clr" onclick="clearW26Col('sh','Sim')" title="点击清空该列（成交数量/成交价格）"><span class="w26-dot" style="background:var(--amber)"></span>模拟卖出</th></tr>
        <tr><td>数量</td>
          <td class="w26-inp"><input id="shBQty" type="number" step="100" min="0"></td>
          <td class="w26-inp"><input id="shSQty" type="number" step="100" min="0" placeholder="默认=买入"></td>
          <td class="w26-inp w26-sim"><input id="shSimQty" type="number" step="100" min="0"></td></tr>
        <tr><td>价格</td>
          <td class="w26-inp"><input id="shBPrice" type="number" step="0.001" min="0"></td>
          <td class="w26-inp"><input id="shSPrice" type="number" step="0.001" min="0"></td>
          <td class="w26-inp w26-sim"><input id="shSimPrice" type="number" step="0.001" min="0"></td></tr>
        <tr><td>手续费</td><td class="num" id="shBComm">—</td><td class="num" id="shSComm">—</td><td class="num w26-sim" id="shSimComm">—</td></tr>
        <tr><td>过户费</td><td class="num" id="shBTrans">—</td><td class="num" id="shSTrans">—</td><td class="num w26-sim" id="shSimTrans">—</td></tr>
        <tr><td>印花税</td><td class="num">0.00</td><td class="num" id="shSStamp">—</td><td class="num w26-sim" id="shSimStamp">—</td></tr>
        <tr><td>成交金额</td><td class="num" id="shBTurn">—</td><td class="num" id="shSTurn">—</td><td class="num w26-sim" id="shSimTurn">—</td></tr>
        <tr><td>成本价</td><td class="num w26-main-cell" id="shBCost">—</td><td class="num"></td><td class="num w26-sim"></td></tr>
        <tr><td>保本价</td><td class="num w26-main-cell" id="shBBreak">—</td><td class="num"></td><td class="num w26-sim"></td></tr>
        <tr><td>发生金额</td><td class="num" id="shBOccur">—</td><td class="num" id="shSOccur">—</td><td class="num w26-sim" id="shSimNet">—</td></tr>
        <tr><td>盈亏</td><td class="num"></td><td class="num" id="shPnl">—</td><td class="num w26-sim" id="shSimPnl">—</td></tr>
      </table>
    </div>
    <div class="w26-side">
      <table id="szTable">
        <tr class="w26-sz-head"><th class="w26-corner w26-m-sz">深市</th><th class="w26-clr" onclick="clearW26Col('sz','B')" title="点击清空该列（成交数量/成交价格）"><span class="w26-dot" style="background:var(--red)"></span>买入</th><th class="w26-clr" onclick="clearW26Col('sz','S')" title="点击清空该列（成交数量/成交价格）"><span class="w26-dot" style="background:var(--green)"></span>卖出</th><th class="w26-sim w26-clr" onclick="clearW26Col('sz','Sim')" title="点击清空该列（成交数量/成交价格）"><span class="w26-dot" style="background:var(--amber)"></span>模拟卖出</th></tr>
        <tr><td>数量</td>
          <td class="w26-inp"><input id="szBQty" type="number" step="100" min="0"></td>
          <td class="w26-inp"><input id="szSQty" type="number" step="100" min="0" placeholder="默认=买入"></td>
          <td class="w26-inp w26-sim"><input id="szSimQty" type="number" step="100" min="0"></td></tr>
        <tr><td>价格</td>
          <td class="w26-inp"><input id="szBPrice" type="number" step="0.001" min="0"></td>
          <td class="w26-inp"><input id="szSPrice" type="number" step="0.001" min="0"></td>
          <td class="w26-inp w26-sim"><input id="szSimPrice" type="number" step="0.001" min="0"></td></tr>
        <tr><td>手续费</td><td class="num" id="szBComm">—</td><td class="num" id="szSComm">—</td><td class="num w26-sim" id="szSimComm">—</td></tr>
        <tr><td>过户费</td><td class="num" id="szBTrans">—</td><td class="num" id="szSTrans">—</td><td class="num w26-sim" id="szSimTrans">—</td></tr>
        <tr><td>印花税</td><td class="num">0.00</td><td class="num" id="szSStamp">—</td><td class="num w26-sim" id="szSimStamp">—</td></tr>
        <tr><td>成交金额</td><td class="num" id="szBTurn">—</td><td class="num" id="szSTurn">—</td><td class="num w26-sim" id="szSimTurn">—</td></tr>
        <tr><td>成本价</td><td class="num w26-main-cell" id="szBCost">—</td><td class="num"></td><td class="num w26-sim"></td></tr>
        <tr><td>保本价</td><td class="num w26-main-cell" id="szBBreak">—</td><td class="num"></td><td class="num w26-sim"></td></tr>
        <tr><td>发生金额</td><td class="num" id="szBOccur">—</td><td class="num" id="szSOccur">—</td><td class="num w26-sim" id="szSimNet">—</td></tr>
        <tr><td>盈亏</td><td class="num"></td><td class="num" id="szPnl">—</td><td class="num w26-sim" id="szSimPnl">—</td></tr>
      </table>
    </div>
  </div>
</div>

<script src="计算器费率配置.js"></script>
<script>
// ============ 沪深完整计算（2026 xlsx 复刻 · w26 前缀隔离） ============
function w26Rates(){
  var c = (window.CALC_CONFIG && window.CALC_CONFIG.rates) || {};
  return {
    sh:  typeof c.commSH === 'number' ? c.commSH : 0.00013539,
    sz:  typeof c.commSZ === 'number' ? c.commSZ : 0.0001253,
    trans: typeof c.transfer === 'number' ? c.transfer : 0.00001,
    stamp: typeof c.stamp === 'number' ? c.stamp : 0.0005,
    min:  typeof c.minCommission === 'number' ? c.minCommission : 5
  };
}
function w26Comm(turn, rate, min){ var c = turn * rate; return c < min ? min : c; }
function w26Fmt(x, nd){
  if (x === null || x === undefined || isNaN(x)) return '—';
  nd = nd === undefined ? 2 : nd;
  return Math.abs(x).toLocaleString('zh-CN', {minimumFractionDigits:nd, maximumFractionDigits:nd});
}
function w26Set(id, v, nd){ document.getElementById(id).textContent = w26Fmt(v, nd); }
function w26Num(id){ var v = document.getElementById(id).value; return v === '' ? null : parseFloat(v); }
function w26PnlCell(id, v){
  var el = document.getElementById(id);
  if (v === null || v === undefined || isNaN(v)){ el.textContent = '—'; el.className = 'num'; return; }
  el.textContent = w26Fmt(v, 2);
  el.className = 'num ' + (v >= 0 ? 'w26-pos' : 'w26-neg');
}
function w26CalcSide(rate, bQty, bPrice, sQty, sPrice){
  var r = w26Rates();
  var bTurn  = bQty && bPrice ? bQty * bPrice : null;
  var bComm  = bTurn !== null ? w26Comm(bTurn, rate, r.min) : null;
  var bTrans = bTurn !== null ? bTurn * r.trans : null;
  var bOccur = bTurn !== null ? bTurn + bTrans + bComm : null;
  var bCost  = bOccur !== null && bQty ? bOccur / bQty : null;
  var bBreak = bOccur !== null && bQty ? bOccur / (1 - rate - r.stamp - r.trans) / bQty : null;
  if (!sQty) sQty = bQty;
  var sTurn  = sQty && sPrice ? sQty * sPrice : null;
  var sComm  = sTurn !== null ? w26Comm(sTurn, rate, r.min) : null;
  var sTrans = sTurn !== null ? sTurn * r.trans : null;
  var sStamp = sTurn !== null ? sTurn * r.stamp : null;
  var sOccur = sTurn !== null ? sTurn - sStamp - sTrans - sComm : null;
  var pnl    = (bOccur !== null && sOccur !== null) ? sOccur - bOccur : null;
  return { bTurn:bTurn, bComm:bComm, bTrans:bTrans, bOccur:bOccur, bCost:bCost, bBreak:bBreak,
           sTurn:sTurn, sComm:sComm, sTrans:sTrans, sStamp:sStamp, sOccur:sOccur, pnl:pnl };
}
function w26SimSell(rate, qty, price){
  var r = w26Rates();
  if (!qty || !price) return { turn:null, comm:null, trans:null, stamp:null, net:null };
  var turn = qty * price;
  var comm = w26Comm(turn, rate, r.min);
  var trans = turn * r.trans;
  var stamp = turn * r.stamp;
  return { turn:turn, comm:comm, trans:trans, stamp:stamp, net:turn - comm - trans - stamp };
}
function w26Render(){
  var r = w26Rates();
  var sh = w26CalcSide(r.sh, w26Num('shBQty'), w26Num('shBPrice'), w26Num('shSQty'), w26Num('shSPrice'));
  var sz = w26CalcSide(r.sz, w26Num('szBQty'), w26Num('szBPrice'), w26Num('szSQty'), w26Num('szSPrice'));
  w26Set('shBComm', sh.bComm, 2); w26Set('shSComm', sh.sComm, 2);
  w26Set('shBTrans', sh.bTrans, 2); w26Set('shSTrans', sh.sTrans, 2);
  w26Set('shSStamp', sh.sStamp, 2);
  w26Set('shBTurn', sh.bTurn, 2); w26Set('shSTurn', sh.sTurn, 2);
  w26Set('shBCost', sh.bCost, 4); w26Set('shBBreak', sh.bBreak, 6);
  w26Set('shBOccur', sh.bOccur, 2); w26Set('shSOccur', sh.sOccur, 2);
  w26PnlCell('shPnl', sh.pnl);
  w26Set('szBComm', sz.bComm, 2); w26Set('szSComm', sz.sComm, 2);
  w26Set('szBTrans', sz.bTrans, 2); w26Set('szSTrans', sz.sTrans, 2);
  w26Set('szSStamp', sz.sStamp, 2);
  w26Set('szBTurn', sz.bTurn, 2); w26Set('szSTurn', sz.sTurn, 2);
  w26Set('szBCost', sz.bCost, 4); w26Set('szBBreak', sz.bBreak, 6);
  w26Set('szBOccur', sz.bOccur, 2); w26Set('szSOccur', sz.sOccur, 2);
  w26PnlCell('szPnl', sz.pnl);
  var shSim = w26SimSell(r.sh, w26Num('shSimQty'), w26Num('shSimPrice'));
  w26Set('shSimTurn', shSim.turn, 2);
  w26Set('shSimComm', shSim.comm, 2); w26Set('shSimTrans', shSim.trans, 2); w26Set('shSimStamp', shSim.stamp, 2);
  w26Set('shSimNet', shSim.net, 2);
  w26PnlCell('shSimPnl', sh.bOccur !== null && shSim.net !== null ? shSim.net - sh.bOccur : null);
  var szSim = w26SimSell(r.sz, w26Num('szSimQty'), w26Num('szSimPrice'));
  w26Set('szSimTurn', szSim.turn, 2);
  w26Set('szSimComm', szSim.comm, 2); w26Set('szSimTrans', szSim.trans, 2); w26Set('szSimStamp', szSim.stamp, 2);
  w26Set('szSimNet', szSim.net, 2);
  w26PnlCell('szSimPnl', sz.bOccur !== null && szSim.net !== null ? szSim.net - sz.bOccur : null);
}
// 点击表头「买入/卖出/模拟卖出」清空该列数据（成交数量 + 成交价格），随后重算
function clearW26Col(mkt, col){
  var map = { B: ['Qty','Price'], S: ['Qty','Price'], Sim: ['Qty','Price'] };
  var suffix = map[col] || [];
  suffix.forEach(function(suf){
    var el = document.getElementById(mkt + col + suf);
    if (el) el.value = '';
  });
  w26Render();
}
document.addEventListener('input', function(e){
  if (e.target && e.target.id && /^(sh|sz)/.test(e.target.id)) w26Render();
});
w26Render();
