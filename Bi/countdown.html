<h1>倒数日</h1>

<div class="card">

<div id="hist-gate" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1e1e1e;color:#eee;padding:22px 26px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-family:sans-serif;min-width:260px;">

    </div>

<script>
function $(id){ return document.getElementById(id); }
/* 春节（农历正月初一）公历日期表，用于「自动续年」轮转；数据已核对 2026–2035 */
const SPRING_FESTIVAL = {2026:'2026-02-17',2027:'2027-02-06',2028:'2028-01-26',2029:'2029-02-13',2030:'2030-02-03',2031:'2031-01-23',2032:'2032-02-11',2033:'2033-01-31',2034:'2034-02-19',2035:'2035-02-08'};
/* 年度轮转：返回下一个 >= 今天的生效日期（节气/节日按真实月日，春节按农历正月初一） */
function effectiveDate(it){
    if(!it.recur) return {date:it.date, name:it.name, rolled:false};
    const today = new Date(); today.setHours(0,0,0,0);
    if(it.recur.type === 'year'){
        let y = today.getFullYear();
        let cand = new Date(y, it.recur.m-1, it.recur.d);
        while(cand < today){ y++; cand = new Date(y, it.recur.m-1, it.recur.d); }
        return {date: y+'-'+String(it.recur.m).padStart(2,'0')+'-'+String(it.recur.d).padStart(2,'0'), name:it.name, rolled:true, year:y};
    }
    const years = Object.keys(SPRING_FESTIVAL).map(Number).sort(function(a,b){return a-b;});
    for(let i=0;i<years.length;i++){ const y=years[i]; const d=new Date(SPRING_FESTIVAL[y]); if(d>=today) return {date:SPRING_FESTIVAL[y], name:it.name+'（'+y+'）', rolled:true, year:y}; }
    const last = years[years.length-1];
    return {date:(last+1)+'-02-01', name:it.name+'（'+(last+1)+'）', rolled:true, year:last+1};
}
const COUNTDOWN_ITEMS = [
    /* 年度轮转节点（过期自动指向下一次，永远显示「还剩」） */
    {name:'白露（申月结束·转酉月）', recur:{type:'year', m:9, d:8}},
    {name:'国庆节', recur:{type:'year', m:10, d:1}},
    {name:'立春（换年柱）', recur:{type:'year', m:2, d:4}},
    {name:'春节', recur:{type:'spring'}},
    /* 纪念日（已过去） */
    {name:'执子之手', date:'2012-04-21'},
    {name:'手机号入网许可', date:'2015-09-11'},
    {name:'静思悟道者', date:'2020-09-18'}
];
function renderCountdown(){
    const now = new Date();
    const ty=now.getFullYear(), tm=now.getMonth()+1, td=now.getDate();
    const today = new Date(ty, tm-1, td);
    let html = '';
    COUNTDOWN_ITEMS.forEach(function(it){
        const eff = effectiveDate(it);
        const p = eff.date.split('-');
        const target = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
        const diff = Math.round((today - target) / 86400000);
        let num, label;
        if(diff > 0){ num = diff; label = '已过去'; }
        else if(diff < 0){ num = -diff; label = '还剩'; }
        else { num = 0; label = '就是今天'; }
        const sub = eff.rolled ? ' · ⟳ 年度轮转' : '';
        html += '<div class="cd-item"><div class="cd-info"><div class="cd-name">'+eff.name+'</div>'
              + '<div class="cd-date">'+eff.date+sub+'</div></div>'
              + '<div class="cd-right"><div class="cd-num">'+num+'<span class="unit">天</span></div>'
              + '<div class="cd-label">'+label+'</div></div></div>';
    });
    $('countdownResult').innerHTML = html;
}
renderCountdown();

/* ===== 历史事件：已用 AES-256-GCM + PBKDF2 加密（与 Nav 隐藏链接同一方案）=====
   源码仅为密文 HISTORY_PARAMS；不隐藏——区块始终可见，输对 Dedicated 口令后还原并渲染。
   原事件字段：name=事件名，date=起始日，date2=结束日（区间事件）；长辈离世置前，其后工作事件按时间先后 */
const HISTORY_PARAMS = {"iterations":100000,"salt":"ak+we8h8Iq3374LaDt6eDw==","iv":"/inu8nYhDQ0lte4L","ct":"oOJG8ON+KsiWLZT4kZj2McUQIuzXmNp+7RQIBw81AyFxvqD2X5J1B5llN3wrfBCldfA7l9QaO0kUrzcRlxO+MbRzESsCkliK/S0N5TDVW12NhsRWWgjbEYNDyt9fiQB1hsOCAHlrkjjTXZ0HxlXY3uLJAmNXIM0QFqxklgW7gT7jOjWJyyg60ceVixkrkmZMVHSgONvIYXxwg7yP/vkuveRTphAtuf78pHP+yrfGPlko+Qukr9gRtzDDIyUjHtYblMbn3QZWCgb3sCKFTt1xBY2yVwg8GctYOrs5HMKkqjgbh2bgMaG5xCl/VCTtjhNlrlwemmdoQ6qh/ZTX7lCeUmXWM51X+np5FB1iy8TTu2qNrIZtup+HECG9EZxCv9LWeUZfwa6/dmp7rATnZeWsDgVH7/3eriz8VjESG3ZUCD51Wv1nX8KoIC1ifbl14yOsciXD4IS0yHiGQsSzdyHNVBcyKfPvnU2gaq+Qp5b3QIEL8H+7T7DQnDieDoOGIHke/XdXknlm1b1sjvUMpf07rc0vpRVaB6I1NKIHb1/CWokwgCYV5WR5jLx9DElQlOcHn2AfJqHnnHvyo39cI2cNdg/pNNN2IbXPQ1NUXk9tdrCeWM1X8mylhCRfRF7Wf/hE0bP2Vbd52C8eiekCO1vaEqV1Pp8/ABssN+zyb2/ZJMKFBe3nWyxXRAKrKEr8Nl3YV8VTfYa3HEMFyRZH3ei50oQojqjXgFwoxz57Wx5tsxDIPlnu8B7cmSFZWRDocwecRtaPJDYXWHvaikT0p8Fvi+JJDCGa/jqGT0G0WSsPq7G3zxB7eyovcDDlrjjuR4yl/xZFYabY1DrDWPDt+3KpS9UNm/dfidS/5UZUGKTc+PbnTGwZeB7ZE+QH5BxwfT2KxI6+XnnFFsQ51sV60nDVjRoBewXxOF5oHeROXTqEmSeeWuVr4pIaV/t5nt1/CWEcrS+GGgJXr09qIFeWqTYfDAN2q/eQDKeSNIEjkFGmgtqevrYynTlVTU9Uy0uK07jrdDZKUjiwlChp6wxdeIiORH/KKVDy3A=="};

let HISTORY_DECRYPTED = null; // 解密后的事件数组；null = 尚未解锁

function b64ToBytes(b){ return Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); }); }

async function decryptHistory(pw){
    if(!window.crypto || !crypto.subtle){
        alert('当前环境不支持解密（需 https 或 localhost 安全上下文）');
        return false;
    }
    try{
        const enc = new TextEncoder();
        const salt = b64ToBytes(HISTORY_PARAMS.salt);
        const iv = b64ToBytes(HISTORY_PARAMS.iv);
        const ct = b64ToBytes(HISTORY_PARAMS.ct);
        const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
            { name:'PBKDF2', salt:salt, iterations:HISTORY_PARAMS.iterations, hash:'SHA-256' },
            baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']
        );
        const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, ct);
        HISTORY_DECRYPTED = JSON.parse(new TextDecoder().decode(plainBuf));
        return true;
    }catch(e){
        return false;
    }
}

function renderHistory(events){
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let html = '';
    events.forEach(function(it){
        const p = it.date.split('-');
        const target = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
        const diff = Math.round((today - target) / 86400000);
        const yrs = Math.floor(diff / 365.25);
        let dateLine = it.date;
        let rightNum, rightLabel;
        if(it.date2){
            /* 区间事件：只显示区间天数（在岗/使用等），不显示距今天数 */
            const q = it.date2.split('-');
            const end = new Date(parseInt(q[0]), parseInt(q[1])-1, parseInt(q[2]));
            const span = Math.round((end - target) / 86400000);
            dateLine = it.date+' ~ '+it.date2;
            rightNum = span+'<span class="unit">天</span>';
            rightLabel = it.tag || '在岗';
        } else {
            /* 单日事件：显示距今天数 */
            rightNum = diff+'<span class="unit">天前</span>';
            rightLabel = '约 '+yrs+' 年前';
        }
        html += '<div class="cd-item"><div class="cd-info"><div class="cd-name">'+it.name+'</div>'
              + '<div class="cd-date">'+dateLine+'</div></div>'
              + '<div class="cd-right"><div class="cd-num">'+rightNum+'</div>'
              + '<div class="cd-label">'+rightLabel+'</div></div></div>';
    });
    $('historyResult').innerHTML = html;
}

function showHistoryLocked(){
    $('historyResult').innerHTML = '<div class="cd-item"><div class="cd-info">'
        + '<div class="cd-name">🔒 历史事件已加密</div>'
        + '<div class="cd-date">需输入口令查看</div></div>'
        + '<div class="cd-right" style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">'
        + '<div class="cd-num" style="font-size:15px;color:var(--orange)">锁定</div>'
        + '<button id="hist-unlock" style="padding:6px 12px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:12px;cursor:pointer;">🔓 输入口令解锁</button>'
        + '</div></div>';
    const ub = $('hist-unlock');
    if(ub){ ub.addEventListener('click', openHistGate); }
}
showHistoryLocked();

/* 折叠开关 + 口令门（仅加密、不隐藏：区块始终可见，展开后输对口令还原） */
function openHistGate(){
    const gate = $('hist-gate');
    const pwInput = $('hist-pw');
    if(!gate) return;
    gate.style.display = 'flex';
    setTimeout(function(){ if(pwInput) pwInput.focus(); }, 50);
}
(function(){
    const ht = document.querySelector('.history-toggle');
    const hb = $('historyBody');
    const gate = $('hist-gate');
    const pwInput = $('hist-pw');
    if(!ht || !hb) return;
    function closeGate(){ if(gate){ gate.style.display='none'; if(pwInput) pwInput.value=''; } }
    async function doUnlock(){
        const ok = await decryptHistory(pwInput ? pwInput.value : '');
        if(ok){ renderHistory(HISTORY_DECRYPTED); closeGate(); }
        else { alert('口令错误'); }
    }
    ht.addEventListener('click', function(){
        const open = hb.hasAttribute('hidden');
        if(open){ hb.removeAttribute('hidden'); ht.setAttribute('aria-expanded','true'); }
        else { hb.setAttribute('hidden',''); ht.setAttribute('aria-expanded','false'); }
    });
    if(gate){
        document.getElementById('hist-ok').addEventListener('click', doUnlock);
        document.getElementById('hist-cancel').addEventListener('click', closeGate);
        pwInput.addEventListener('keydown', function(e){ if(e.key==='Enter') doUnlock(); });
    }
})();
</script>
